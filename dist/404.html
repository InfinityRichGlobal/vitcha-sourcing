  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="./logo.jpg" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FFFFFF" />

    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ฉันจะเป็นหัวแถว" />
    <meta name="application-name" content="ฉันจะเป็นหัวแถว" />
    <link rel="manifest" href="./manifest.json" />
    <title>ฉันจะเป็นหัวแถว</title>
    <!-- Leaflet CSS for Map -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Font Awesome 6 Icons -->
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <script type="module" crossorigin src="./assets/index-DusXKQX-.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-DeQNcuOO.css">
  </head>
  <body class="bg-white text-slate-900 antialiased selection:bg-emerald-500 selection:text-white min-h-screen">
    <div id="root"></div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { updateViaCache: 'none' }).then((reg) => {
            reg.update().catch(() => {});
          }).catch((err) => {
            console.log('SW registration error:', err);
          });
        });
      }
      // Auto-detect new UI deployments on iPhone Home Screen (PWA) & Safari without manual refresh
      (function () {
        const getLoadedBundle = () => {
          const el = document.querySelector('script[src*="assets/index-"]');
          return el ? (el.getAttribute('src') || '').split('/').pop() : null;
        };
        const checkLatestBuild = async () => {
          if (document.hidden || document.querySelector('[role="dialog"]')) return;
          const current = getLoadedBundle();
          if (!current) return;
          try {
            const res = await fetch('./index.html?_t=' + Date.now(), { cache: 'no-store' });
            if (!res.ok) return;
            const html = await res.text();
            const match = html.match(/assets\/(index-[A-Za-z0-9_-]+\.js)/);
            if (match && match[1] && match[1] !== current) {
              if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map((k) => caches.delete(k)));
              }
              window.location.reload();
            }
          } catch {}
        };
        document.addEventListener('visibilitychange', () => {
          if (!document.hidden) checkLatestBuild();
        });
        window.addEventListener('focus', checkLatestBuild);
        setInterval(checkLatestBuild, 25000);
      })();
    </script>
  </body>
</html>
